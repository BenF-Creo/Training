<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<title>Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a single bright column, hairline rules instead of boxes, large light numerals and tight sans headings. Light only, by request. */
  color-scheme:light;
  --bg:#FFFFFF; --surface:#F5F6F5; --ink:#15181A; --muted:#737A7E; --line:#E6E8E7;
  --accent:#3F6B5B; --accent-soft:#E7EFEB; --warn:#A8503C; --warn-soft:#F6E9E5;
  --eq:#C6CBCA; --fig:#15181A; --move:#3F6B5B; --wrong:#A8503C;
  --display:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;width:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.03em}
h1{font-size:36px} h2{font-size:26px} h3{font-size:20px;letter-spacing:-.02em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#app{width:100%;overflow:hidden}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y pinch-zoom;overscroll-behavior:contain}
.screen>*{min-width:0;max-width:100%}
.screen>.chips,.screen>.exnav{max-width:none}
.screen{width:100%;max-width:560px;margin:0 auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:22px}

/* session bar */
#sess{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--accent-soft);border-bottom:1px solid var(--line)}
#sess[hidden]{display:none}
#sess .sgo{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column}
#sess small{font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sess b{font:600 22px/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#sess .sfin{height:38px;padding:0 16px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:14px}

/* tab bar */
#tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);font-size:11px;font-weight:600}
#tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="page"]{color:var(--ink)}

/* type bits */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);font-size:15px}
.tiny{font-size:13px;color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:36px}
.back{display:inline-flex;align-items:center;gap:4px;font-weight:600;font-size:15px;color:var(--ink);height:36px;padding-right:10px}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tbtns{display:flex;gap:8px}
.chip{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:600;color:var(--ink);background:var(--bg);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;touch-action:pan-x;overscroll-behavior-x:contain;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.chips::-webkit-scrollbar{display:none}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:0 20px;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;text-align:center}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--surface);color:var(--ink)}
.btn.small{min-height:44px;font-size:15px}
.link{color:var(--muted);font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* surfaces */
.hero{background:var(--surface);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:16px}
.hero h2{font-size:34px}
.card{border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.soft{background:var(--surface);border-color:transparent}
.card.done{border-color:var(--accent);background:var(--accent-soft)}
.section{display:flex;flex-direction:column;gap:10px}
.section>h3{margin-bottom:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.tile{background:var(--surface);border-radius:16px;padding:12px 14px;min-width:0}
.tile small{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.tile b{display:block;font:500 26px/1.2 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile b.txt{font:600 15px/1.3 var(--body);margin-top:3px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted)}
.week i{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:block}
.week .w i{background:var(--ink);border-color:var(--ink)}
.week .c i{background:var(--accent-soft);border-color:var(--accent)}
.week .t{color:var(--ink)}
.week .t i{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}

/* rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line);min-height:60px}
.rows>.row:last-child,.grp>.row:last-child{border-bottom:none}
.row .tag{flex:none;width:30px;font:500 17px/1 var(--display);color:var(--muted)}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:600;font-size:16px;line-height:1.3}
.row .main span{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.row .meta{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.row .meta.ok{color:var(--accent);font-weight:700}
.row .chev{flex:none;width:16px;height:16px;fill:none;stroke:var(--eq);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row.skipped .main b{text-decoration:line-through;color:var(--muted)}
.grp{border-left:2px solid var(--ink);padding-left:14px;margin:6px 0}
.grp>.cap{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.listwrap{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* drawings */
.frames{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.frames.three{grid-template-columns:1fr auto 1fr auto 1fr}
.frame{background:var(--surface);border-radius:18px;padding:6px 6px 10px;text-align:center}
.frame svg{width:100%;height:auto;display:block}
.frame .lab{font-size:12px;font-weight:600;color:var(--muted)}
.frame.end .lab{color:var(--accent)}
.frame.bad .lab{color:var(--warn)}
.arrow{color:var(--eq);font-size:18px}
.view{font-size:13px;color:var(--muted);text-align:center}
.diff{font-size:14px;background:var(--surface);border-radius:14px;padding:12px 14px}
.note{font-size:14px;border-left:2px solid var(--accent);padding:2px 0 2px 12px;color:var(--ink)}

/* logging */
.sethead{display:flex;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{height:28px;min-width:38px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 48px;gap:8px;align-items:center}
.setrow.one{grid-template-columns:26px 1fr 48px}
.setrow.hold{grid-template-columns:26px 1fr auto 48px}
.setrow .sn{font:500 16px/1 var(--display);color:var(--muted);text-align:center}
.field{position:relative}
.field input{width:100%;height:50px;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:0 44px 0 14px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;min-width:0;-moz-appearance:textfield}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field input::placeholder{color:var(--eq);font-weight:500}
.field span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.tick{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--eq)}
.tick svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.setrow.done .tick{background:var(--accent);border-color:var(--accent);color:#fff}
.setrow.done .field input{background:var(--surface);border-color:transparent}
.holdbtn{height:48px;padding:0 14px;border-radius:14px;background:var(--surface);font-weight:600;font-size:14px}
.conv{grid-column:2/-1;font-size:13px;font-weight:600;color:var(--accent);margin-top:-4px}
.conv:empty{display:none}
.sets{display:flex;flex-direction:column;gap:8px}
.statline{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.statline dt{color:var(--muted)}
.statline dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.hint{font-size:14px;font-weight:600;color:var(--accent)}

details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-weight:600;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:300 22px/1 var(--display);color:var(--muted)}
details[open] summary::after{content:"\2212"}
.how{padding-bottom:16px;display:flex;flex-direction:column;gap:6px}
.how h4{margin:8px 0 0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.how ol,.how ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.how .avoid li::marker{color:var(--warn)}
.accs{display:flex;flex-direction:column}

.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:13px;color:var(--muted)}
.fld input,.fld select{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:0 12px;font-size:16px;min-width:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}

/* footer nav on exercise screen */
.exnav{position:sticky;bottom:0;display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 20px calc(12px);margin:0 -20px -40px;background:linear-gradient(to top,var(--bg) 78%,rgba(255,255,255,0));}
.exnav .prev{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--bg)}
.exnav .prev svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.exnav .btn{min-width:0}
.exnav .btn span{min-width:0;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* charts and lists */
.chart{width:100%;height:auto;display:block}
.chart text{font:11px var(--body);fill:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.hl{list-style:none;padding:0;margin:0}
.hl li{display:grid;grid-template-columns:4.4em 1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.hl li>span:first-child{color:var(--muted)}
.hl .sd{display:block;font-size:13px;color:var(--muted)}
.del{font-size:13px;color:var(--muted);text-decoration:underline;padding:6px 0 6px 6px}
.pbt{width:100%;border-collapse:collapse;font-size:14px}
.pbt td{padding:9px 4px 9px 0;border-top:1px solid var(--line);vertical-align:top}
.pbt td:nth-child(2),.pbt td:nth-child(3){white-space:nowrap;font-variant-numeric:tabular-nums}
.pbt tr.g th{text-align:left;font:600 16px/1.2 var(--display);padding:16px 0 6px}
.muted{color:var(--muted)}
.tline{width:100%;height:auto;display:block}
.tline text{font:11px var(--body);fill:var(--muted)}
.phl{list-style:none;padding:0 0 12px;margin:0;font-size:14px;display:flex;flex-direction:column;gap:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.lvls{display:flex;flex-direction:column;gap:10px}
.lvl{display:grid;grid-template-columns:10px 1fr;gap:12px;align-items:start}
.lvl i{width:10px;height:10px;border-radius:50%;margin-top:6px}
.lvl b{display:block;font-size:15px}
.lvl span{font-size:14px;color:var(--muted)}
.rpe{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rpe .chip{width:100%;height:44px}
.ta{width:100%;height:120px;border:1px solid var(--line);border-radius:14px;padding:12px;font:16px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);resize:none}
.prose{display:flex;flex-direction:column;gap:10px;max-width:60ch}
.prose ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}

/* overlays */
.modal{position:fixed;inset:0;z-index:50;background:rgba(21,24,26,.32);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--bg);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:90%;overflow-y:auto;overflow-x:hidden;touch-action:pan-y pinch-zoom;overscroll-behavior:contain;display:flex;flex-direction:column;gap:14px}
.sheet>*{flex:none}
.sheet h3{font-size:24px}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.danger{background:var(--warn)}
.sopt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line)}
.sopt b{font-weight:600;display:block}
.sopt span{font-size:13px;color:var(--muted)}
.sopt em{font-style:normal;font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.shead{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:10px}
.search{width:100%;height:48px;border:1px solid var(--line);border-radius:999px;padding:0 18px;font-size:16px;background:var(--bg)}
.addmine{display:grid;grid-template-columns:1fr auto;gap:8px}
.addmine .btn{width:auto;min-height:48px}

#rest{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 20px;border-top:1px solid var(--line);background:var(--bg);position:relative}
#rest[hidden]{display:none}
#rest small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rest b{font:600 28px/1.1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#rest .bar{position:absolute;left:0;top:-1px;height:2px;background:var(--accent);width:0}
#rest.over{background:var(--accent);color:#fff}
#rest.over small{color:#fff}
#rest.over .chip{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
#rest>div{min-width:0}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:11px 18px;border-radius:999px;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.18)}
#toast[hidden]{display:none}

#hold .hclock{font:300 104px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums;text-align:center}
#hold .htarget{text-align:center;font-weight:600;min-height:1.5em}
#hold.hit .hclock,#hold.hit .htarget{color:var(--accent)}

#ctimer{position:fixed;inset:0;z-index:55;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(20px + env(safe-area-inset-bottom,0px));text-align:center;transition:background .4s}
#ctimer[hidden]{display:none}
#ctimer.lvl2{background:var(--accent);color:#fff}
#ctimer.lvl3{background:var(--warn);color:#fff}
.ctin{width:100%;max-width:480px;display:flex;flex-direction:column;gap:14px;align-items:center}
.cttop{display:flex;justify-content:space-between;width:100%;font-size:14px;opacity:.8}
.ctbar{position:relative;width:100%;height:6px;border-radius:3px;background:rgba(128,128,128,.25);overflow:hidden}
.ctbar i{position:absolute;top:0;bottom:0;left:0;background:currentColor}
.ctlevel{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:5px 14px;margin-top:18px}
.ctphase{font:600 32px/1.1 var(--display);letter-spacing:-.03em}
.ctclock{font:300 120px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.cttarget{font-size:18px;font-weight:600;line-height:1.35;min-height:2.7em}
.ctnext{font-size:14px;opacity:.8}
.ctbtns{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;width:100%;margin-top:18px}
.ctbtns button{height:56px;border-radius:999px;border:1px solid currentColor;font-weight:600}
.ctbtns .ctmain{background:var(--ink);color:#fff;border-color:var(--ink)}
#ctimer.lvl2 .ctmain,#ctimer.lvl3 .ctmain{background:#fff;color:var(--ink);border-color:#fff}
@media (prefers-reduced-motion:reduce){#ctimer{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="sess" hidden><button class="sgo" id="sessgo"><small id="sessname"></small><b id="sessclock">0:00</b></button><button class="sfin" id="sessfin">Finish</button></div>
  <main id="view"></main>
  <div id="rest" hidden role="timer"><i class="bar" id="restbar"></i><div><small id="restname"></small><b id="restclock">0:00</b></div><button class="chip" id="restplus">+15s</button><button class="chip" id="reststop">Skip</button></div>
  <nav id="tabs" aria-label="Main"></nav>
</div>
<div id="toast" hidden role="status"></div>
<div class="modal" id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet" id="sheetin"></div></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="sheet"><h3 id="mmsg"></h3><p class="sub" id="msub"></p><div class="mbtns"><button class="btn ghost" id="mno">Go back</button><button class="btn" id="mok">OK</button></div></div></div>
<div class="modal" id="hold" hidden role="timer" aria-live="polite"><div class="sheet"><p class="eyebrow" id="hname" style="text-align:center"></p><div class="hclock" id="hclock">0</div><p class="htarget" id="htarget"></p><div class="mbtns"><button class="btn ghost" id="hcancel">Cancel</button><button class="btn" id="hstop">Stop and save</button></div></div></div>
<div id="ctimer" hidden role="timer" aria-live="polite"><div class="ctin">
  <div class="cttop"><span id="ctname"></span><span id="ctleft" class="num"></span></div>
  <div class="ctbar"><i id="ctpos"></i></div>
  <div class="ctlevel" id="ctlevel"></div>
  <div class="ctphase" id="ctphase"></div>
  <div class="ctclock" id="ctclock">0:00</div>
  <div class="cttarget" id="cttarget"></div>
  <div class="ctnext" id="ctnext"></div>
  <div class="ctbtns"><button id="ctend">End</button><button id="ctskip">Skip step</button><button id="ctpause" class="ctmain">Pause</button></div>
</div></div>
<script>
const STANDALONE=true;

function lineChart(pts,label){

  const vs=pts.map(p=>p.v); let lo=Math.min(...vs), hi=Math.max(...vs); if(hi===lo){hi+=1;lo-=1}
  const pad=(hi-lo)*0.15; lo-=pad; hi+=pad;
  const X=i=>pl+(Wd-pl-pr)*(i/(pts.length-1)), Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const r=n=>Math.round(n*10)/10, last=pts.length-1;
  return `<svg viewBox="0 0 ${Wd} ${H}" class="chart" role="img" aria-label="${esc(label)} over time">
    <line x1="${pl}" y1="${Y(hi-pad)}" x2="${Wd-pr}" y2="${Y(hi-pad)}" stroke="var(--line)"/>
    <line x1="${pl}" y1="${Y(lo+pad)}" x2="${Wd-pr}" y2="${Y(lo+pad)}" stroke="var(--line)"/>
    <text x="${pl-6}" y="${Y(hi-pad)+4}" text-anchor="end">${r(hi-pad)}</text>
    <text x="${pl-6}" y="${Y(lo+pad)+4}" text-anchor="end">${r(lo+pad)}</text>
    <path d="${path} L${X(last)},${H-pb} L${X(0)},${H-pb} Z" fill="var(--accent-soft)"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(last)}" cy="${Y(pts[last].v)}" r="4.5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>
    <text x="${pl}" y="${H-6}">${fmtD(pts[0].d)}</text>

  </svg>`;
}

function nextTarget(w,i){
  const sk=skipList(), ok=j=>!sk.includes(sid(w.id,w.slots[j])), left=j=>ok(j)&&doneToday(slotKey(w.id,w.slots[j]))<w.slots[j].sets;
  const g=groupOf(w,i), p=g.idx.indexOf(i);
  if(g.idx.length>1){
    for(let q=p+1;q<g.idx.length;q++) if(ok(g.idx[q])) return g.idx[q];
    const again=g.idx.find(j=>left(j)); if(again!=null&&again!==i) return again;
  }
  for(let j=g.idx[g.idx.length-1]+1;j<w.slots.length;j++) if(ok(j)) return j;
  return null;
}

SCREENS.guide=()=>`${topbar('Back')}
  <div><p class="eyebrow">Read once</p><h1>How this plan works</h1></div>
  <div class="prose"><h3>The week</h3><p>Train three days a week. Do Workouts 1 to 4 in order and start again, whatever day it is. Details and cardio are extras for the days in between, and they don’t change what’s up next.</p></div>
  <div class="prose"><h3>How a session runs</h3><ul>
    <li><b>Warm-up.</b> Five easy minutes on a bike or treadmill, then two lighter sets of your first lift.</li>
    <li><b>A is the main lift.</b> Heavy, low reps, long rests. This is where strength is built, so it gets your best effort.</li>
    <li><b>B, C and D are supersets.</b> Two exercises back to back with no rest between them, then rest. B1, B2, rest, repeat. It keeps your heart rate up and gets more work into the hour.</li>
    <li><b>The last block is a finisher.</b> Short and hard: dips, a sled, a carry or a circuit.</li>
    <li><b>Finish with a 10 minute incline walk</b> if you have time. Skip it after Legs.</li></ul></div>
  <div class="prose"><h3>Picking a weight</h3><p>Choose a weight where the last two reps of each set are hard but still look like the drawing. On the main lift, finish each set knowing you had one or two reps left. On everything else, the last set can go until your form is about to slip.</p><p><b>When to go up.</b> Once you hit the top of the rep range on every set, add the smallest weight step next time. The app tells you when.</p></div>
  <div class="prose"><h3>Free weights</h3><p>Squats, bench and deadlifts are in here because they do more than machines. Start each one with the empty bar, set the safety arms, and add weight slowly. If a rack is taken or a lift doesn’t feel right on the day, tap Swap. Every exercise has machine, cable and dumbbell alternatives.</p></div>
  <div class="prose"><h3>Calves and other stubborn areas</h3><p>Calves, forearms and rear shoulders respond to frequency and slow reps. Calves are trained in Legs, Full body and Details. Pause at the bottom and top of every rep and don’t bounce.</p></div>
  <div class="prose"><h3>The honest bit about belly fat</h3><p>You can’t burn fat from one spot. Ab exercises strengthen the muscle underneath, and the fat on top goes only when your overall body fat drops. For someone lean everywhere else, that means building muscle while eating at about maintenance with plenty of protein.</p><ul>

/* ---------- actions ---------- */
function slotCtx(){ const c=cur(); if(c.v!=='ex') return null; const w=W[c.w], slot=w.slots[c.i]; return {c,w,i:c.i,slot,k:slotKey(w.id,slot),id:sid(w.id,slot)}; }
function logSet(s,row){
  const x=slotCtx(); if(!x) return; const k=x.k, u=unitOf(k);
  const raw=u==='kg'?parseFloat(row.querySelector('.w').value):0, r=parseInt(row.querySelector('.r').value,10);
  if(u==='kg'&&!(raw>=0&&isFinite(raw))){ row.querySelector('.w').focus(); return; }
  if(!(r>0)){ row.querySelector('.r').focus(); return; }
  const lu=u==='kg'&&isLb(k), w=lu?toKg(raw):raw, d=today();
  const others=S.lifts.filter(e=>!(e.k===k&&e.d===d&&e.s===s)), prev=best(others.filter(e=>e.k===k),u);
  const entry={d,k,s,w,r,t:Date.now()}; if(lu) entry.lb=raw;
  const isPB=!!(prev&&better(entry,prev,u)); if(isPB) entry.pb=1;
  S.lifts=[...others,entry];
  if(!S.active) S.active={w:x.w.id,start:Date.now()};
  persist();
  if(isPB) toast('New personal best');
  if(x.slot.rest>0) startRest(x.slot.rest,nameOf(k)); else { initAudio(); const nt=nextTarget(x.w,x.i); if(nt!=null&&nt!==x.i&&!isPB) toast('Now '+x.w.slots[nt].g+' · '+nameOf(slotKey(x.w.id,x.w.slots[nt]))); }
  render();
}
async function startWorkout(w){
  if(S.active&&S.active.w!==w){ if(!await ask('Finish '+W[S.active.w].long+' first?','Finish and start',false,'It is still running. Finishing saves it to your log.')) return; await finishWorkout(true); }
  if(!S.active){ S.active={w,start:Date.now()}; persist(); }
  JUSTDONE=null; NAV.tab='workouts'; NAV.stack=[{v:'workout',w}]; UI.open={}; render(true);
}
async function finishWorkout(silent){
  const a=S.active; if(!a) return;
  let end=Date.now(); const list=setsSince(a.start,end), cl=cardioSince(a.start,end);
  if(!list.length&&!cl.length){
    if(silent||await ask('Nothing was logged','Discard',true,'Discard this workout? It won’t appear in your log.')){ S.active=null; persist(); render(); }
    return;
  }
  if(!silent&&!await ask('Finish '+W[a.w].long+'?','Finish workout')) return;
  const lastT=Math.max(...list.map(x=>x.t),...cl.map(x=>x.t)); if(end-lastT>2*3600000) end=lastT+10*60000;
  const m=metrics(list), skipped=skipList().filter(x=>x.startsWith(a.w+'|')).map(x=>x.split('|')[1]), mainC=cl.find(x=>x.part==='main')||{};
  const sess={id:String(a.start),w:a.w,d:today(),start:a.start,end,...m,cmin:cl.reduce((t,x)=>t+(x.min||0),0),skipped,dist:Math.round(cl.reduce((t,x)=>t+(x.dist||0),0)*100)/100,cal:cl.reduce((t,x)=>t+(x.cal||0),0),hr:mainC.hr||0,rpe:mainC.rpe||0,ctype:mainC.type||''};
  S.sessions=[...(S.sessions||[]),sess]; S.active=null; JUSTDONE=sess.id;
  S.skips={d:today(),list:skipList().filter(x=>!x.startsWith(a.w+'|'))};
  stopRest(); persist();
  if(!silent){ NAV.tab='home'; NAV.stack=[]; render(true); } else render();
}

  }catch(e){}
}

  clearInterval(TM.iv); clearTimeout(TM.to); TM.iv=setInterval(restTick,250); restTick(); }

    catch(e){ openSheet(`<h3>Copy your data</h3><p class="sub">Select all of the text below and copy it.</p><textarea class="ta" id="exptxt" readonly></textarea><button class="btn ghost small" data-a="closesheet">Done</button>`); $('exptxt').value=txt; $('exptxt').select(); } },
  exportfile:()=>{ try{ const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})), l=document.createElement('a'); l.href=u; l.download='training-backup-'+today()+'.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000); }catch(e){ toast('Could not save a file. Use Copy my data instead.'); } },
  importopen:()=>openSheet(`<h3>Import data</h3><p class="sub">Paste the text you copied from the other app, or choose a backup file. This replaces what is stored here.</p><textarea class="ta" id="imptxt" placeholder="Paste here" aria-label="Paste your data here"></textarea><input type="file" id="impfile" accept=".json,application/json,text/plain" aria-label="Choose a backup file"><div class="mbtns"><button class="btn ghost" data-a="closesheet">Go back</button><button class="btn" data-a="importdo">Import</button></div>`),
  importdo:async()=>{ let txt=$('imptxt').value.trim(); const f=$('impfile').files[0]; if(!txt&&f) txt=await f.text();
    let d=null; try{ d=JSON.parse(txt); }catch(e){} if(!d||!Array.isArray(d.lifts)){ toast('That doesn’t look like training data'); return; }
    $('sheet').hidden=true;
    if(!await ask('Replace the data in this app?','Import',false,d.lifts.length+' sets, '+((d.sessions||[]).length)+' sessions and '+((d.body||[]).length)+' measurements will be loaded.')){ $('sheet').hidden=false; return; }
    S=Object.assign({custom:[],swaps:{},units:{},lifts:[],body:[],seat:{},sessions:[],active:null,cardio:[],skips:null},d); if(S.active&&!W[S.active.w]) S.active=null;
    registerCustom(); closeSheet(); persist(); toast('Imported'); render(true); },
  delsets:async t=>{ if(await ask('Delete these sets?','Delete',true)){ S.lifts=S.lifts.filter(x=>!(x.k===t.dataset.k&&x.d===t.dataset.d)); persist(); render(); } }
};
document.addEventListener('click',ev=>{ const t=ev.target.closest('[data-a]'); if(!t||t.disabled) return; const f=ACT[t.dataset.a]; if(f) f(t); });
document.addEventListener('input',ev=>{ const el=ev.target;
  if(el.dataset&&el.dataset.seat){ S.seat[el.dataset.seat]=el.value; persist(); }
  else if(el.id==='libq'){ UI.libq=el.value; renderLibList(); }
  else if(el.id==='swapq'){ UI.swapQ=el.value; $('swaplist').innerHTML=swapListHTML(); }
  else if(el.classList.contains('w')){ const c=el.closest('.setrow').querySelector('.conv'); if(c) c.textContent=+el.value>0?'= '+toKg(+el.value)+' kg':''; }
});
document.addEventListener('toggle',ev=>{ const d=ev.target; if(d.dataset&&d.dataset.acc) UI.open[d.dataset.acc]=d.open; },true);
document.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&ev.target.id==='custname') ACT.addcustom(); });

/* ---------- boot ---------- */
if(S.active&&W[S.active.w]){ NAV.tab='workouts'; NAV.stack=[S.active.w==='cardio'?{v:'cardio'}:{v:'workout',w:S.active.w}]; }
else if(S.active) S.active=null;
render(true);
try{ const r=JSON.parse(load('ct')||'null'); if(r&&CPLAN[r.p]&&Date.now()-r.start<3*3600000) startGuided(r.p,{start:r.start,pausedAt:r.pausedAt,paused:r.paused}); }catch(e){}

/* ---------- standalone: offline, storage and screen wake ---------- */
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
let wakeLock=null;
async function keepAwake(){ try{ if(S.active&&'wakeLock' in navigator&&!wakeLock){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{wakeLock=null}); } else if(!S.active&&wakeLock){ wakeLock.release(); } }catch(e){} }
document.addEventListener('click',()=>setTimeout(keepAwake,300));
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) keepAwake(); });
keepAwake();



</script>
</body>
</html>
